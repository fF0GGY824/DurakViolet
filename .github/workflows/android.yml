
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/DurakViolet.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.durakviolet.game"
          package/name="Durak Violet"
          package/signed=true
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          EOF

      - name: Import game assets
        shell: bash
        run: godot --headless --path . --editor --import

      - name: Export Android debug APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/DurakViolet.apk
          test -s build/DurakViolet.apk || { echo 'ERROR: APK was not created'; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build/DurakViolet.apk
          ls -lh build/DurakViolet.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DurakViolet-APK
          path: build/DurakViolet.apk
          if-no-files-found: error
          retention-days: 14
